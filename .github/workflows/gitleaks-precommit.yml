name: gitleaks-precommit
on:
  workflow_dispatch:
    inputs:
      inject_test_fixture:
        description: Inject an obvious synthetic placeholder to verify detection
        type: boolean
        default: false
  push:
    branches: [verify/gitleaks-docs-20261112]
permissions:
  contents: read
  id-token: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install documented Gitleaks version
        shell: bash
        run: |
          set -euo pipefail
          version=8.30.1
          work="$RUNNER_TEMP/gitleaks-install"
          mkdir -p "$work" .github/bin
          curl --fail --location --retry 3 "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_linux_x64.tar.gz" -o "$work/gitleaks_${version}_linux_x64.tar.gz"
          curl --fail --location --retry 3 "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_checksums.txt" -o "$work/checksums.txt"
          (cd "$work"; grep " gitleaks_${version}_linux_x64.tar.gz$" checksums.txt | sha256sum -c -)
          tar -xzf "$work/gitleaks_${version}_linux_x64.tar.gz" -C .github/bin gitleaks
          chmod +x .github/bin/gitleaks
          .github/bin/gitleaks version
          echo "$PWD/.github/bin" >> "$GITHUB_PATH"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Checkout private pre-commit-action
        uses: actions/checkout@v4
        with:
          repository: openlibing-test/pre-commit-action
          ref: main
          token: ${{ secrets.PRIVATE_ACTIONS_READ_TOKEN }}
          path: .private-actions/pre-commit-action
          persist-credentials: false
      - name: Keep private action metadata outside scan workspace
        run: mv .private-actions/pre-commit-action/.git "$RUNNER_TEMP/pre-commit-action-git"
      - name: Create synthetic detection fixture
        if: ${{ inputs.inject_test_fixture == true }}
        run: python -c "from pathlib import Path; Path('gitleaks-validation-placeholder.txt').write_text('Synthetic test placeholder, never a credential\ncustom_key_' + 'A' * 32 + '\n')"
      - name: Run documented pre-commit hook
        id: pre-commit
        uses: ./.private-actions/pre-commit-action
        with:
          extra_args: '--config=.pre-commit-gitleaks.yaml --all-files'
          report-dir: /tmp/pre-commit-reports/
          sarif-file: gitleaks.sarif
      - name: Require real SARIF output
        id: report
        if: ${{ always() }}
        run: |
          test -s gitleaks.sarif
          python -c "import json; d=json.load(open('gitleaks.sarif')); assert d['version']=='2.1.0'; assert isinstance(d['runs'][0].get('results', []), list); print('SARIF findings:', len(d['runs'][0].get('results', [])))"
      - name: Checkout private upload-sarif-action
        if: ${{ always() }}
        uses: actions/checkout@v4
        with:
          repository: openlibing-test/upload-sarif-action
          ref: source-platform-detection
          token: ${{ secrets.PRIVATE_ACTIONS_READ_TOKEN }}
          path: .private-actions/upload-sarif-action
          persist-credentials: false
      - name: Upload SARIF to openLiBing
        if: ${{ always() && steps.report.outcome == 'success' }}
        uses: ./.private-actions/upload-sarif-action
        with:
          sarif_file: ${{ steps.pre-commit.outputs.sarif-files }}
          source_path: .
          env_type: beta # prod currently rejects GITHUB_ACTION callbacks
      - name: Preserve verification artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-precommit-evidence
          if-no-files-found: warn
          path: |
            sarif/*.sarif
            gitleaks.sarif
            /tmp/pre-commit-reports/*.sarif
